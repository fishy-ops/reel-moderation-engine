name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[api,dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: pytest --cov=reel_moderation --cov-report=term-missing
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

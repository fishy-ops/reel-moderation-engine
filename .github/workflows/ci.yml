name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[api,dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: pytest --cov=reel_moderation --cov-report=term-missing
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

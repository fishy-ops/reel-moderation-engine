services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      MODERATION_EXECUTION_PROVIDER: cuda
      MODERATION_SEMANTIC_BACKEND: ensemble
      MODERATION_SEMANTIC_MODE: review
      MODERATION_SEMANTIC_MODEL: google/siglip2-base-patch16-224
      MODERATION_SEMANTIC_MODEL_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
      MODERATION_CLASSIFIER_MODEL: Falconsai/nsfw_image_detection
      MODERATION_CLASSIFIER_MODEL_REVISION: 96cb0d0342c7afb80cab76ecc58b265fa44da256
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

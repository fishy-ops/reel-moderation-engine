services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      MODERATION_EXECUTION_PROVIDER: cuda
      MODERATION_SEMANTIC_BACKEND: ensemble
      MODERATION_SEMANTIC_MODE: review
      MODERATION_SEMANTIC_MODEL: google/siglip2-base-patch16-224
      MODERATION_CLASSIFIER_MODEL: Falconsai/nsfw_image_detection
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
